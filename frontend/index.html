<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Testing dashboard for the transaction webhook service" />
    <title>Txn Webhook Dashboard</title>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var prefs = JSON.parse(localStorage.getItem('txn-dashboard:prefs') || '{}')
        var theme = prefs.theme || 'system'
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
